name: Collect KMA snapshots
on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kma-data-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check API credential
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: |
          if [ -z "$KMA_SERVICE_KEY" ]; then
            echo "::error::Add the KMA_SERVICE_KEY repository Secret before starting collection."
            exit 1
          fi
      - name: Collect without logging credentials
        id: collect
        continue-on-error: true
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python collector/collect.py
      - name: Preserve successful snapshots
        run: |
          git config user.name "kma-scorecard-bot"
          git config user.email "kma-scorecard-bot@users.noreply.github.com"
          git add archive dist/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive KMA snapshots"
            git push
          fi
      - name: Surface partial collection failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection incomplete. Check key approval, quota and KMA availability. Successful snapshots were retained."
          exit 1
