name: Verify app and collector
on:
  push:
    branches: [main]
    paths-ignore:
      - 'archive/**'
      - 'dist/data.json'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --check dist/app.mjs
      - run: node --check dist/sw.js
