name: Diagnose KMA connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe.yml'
      - 'collector/probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check KMA response without printing URLs, keys or body
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python collector/probe.py
