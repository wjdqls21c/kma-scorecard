name: Recover Seoul May 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/seoul-may-recovery.yml']
permissions:
  contents: write
concurrency:
  group: seoul-may-recovery
  cancel-in-progress: false
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        month: ['2026-05']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_MONTH: ${{ matrix.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify month boundaries before collection
        run: |
          python -m unittest discover -s tests -p test_month.py
          python -m unittest discover -s tests -p test_checkpoint_retry.py
      - name: Resume this month's completed requests
        run: |
          git config user.name "kma-scorecard-bot"
          git config user.email "kma-scorecard-bot@users.noreply.github.com"
          data_branch="seoul-${TARGET_MONTH}-data"
          data_path="archive/hub/seoul/${TARGET_MONTH}"
          source_sha=$(git rev-parse HEAD)
          if git ls-remote --exit-code --heads origin "$data_branch" >/dev/null; then
            git fetch origin "$data_branch"
            git checkout -B "$data_branch" "origin/$data_branch"
            git checkout "$source_sha" -- collector/seoul_month.py collector/validate_seoul.py collector/seoul_month_recovery.py
          else
            git checkout -B "$data_branch"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: seoul-2026-05-checkpoints
          run-id: 41562542364
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .seoul-recovery
      - name: Merge retained artifact responses
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'collector')
          import seoul_month as m
          m.configure('2026-05')
          restored=0
          for p in Path('.seoul-recovery').rglob('*.json'):
              if p.name=='summary.json':continue
              incoming=m.read(p,{})
              if 'responses' not in incoming:continue
              target=m.DIR/p.name
              old=m.read(target,{})
              if old:
                  for key,response in incoming['responses'].items():
                      prior=old['responses'].get(key)
                      if prior and prior!=response:raise ValueError('Checkpoint conflict')
                      old['responses'][key]=response
                  for key,value in incoming['usage'].items():
                      old['usage'][key]=max(old['usage'].get(key,0),value)
                  old['complete']=len(old['responses'])==32
                  incoming=old
              m.write(target,incoming);restored+=1
          print('Restored artifact date files:',restored)
          PY
      - name: Collect dates and save each checkpoint
        env:
          KMA_HUB_AUTH_KEY: ${{ secrets.KMA_HUB_AUTH_KEY }}
        run: python collector/seoul_month_recovery.py --month "$TARGET_MONTH"
      - name: Verify and publish this complete month
        run: |
          data_branch="seoul-${TARGET_MONTH}-data"
          data_path="archive/hub/seoul/${TARGET_MONTH}"
          git fetch origin main
          git checkout -B main origin/main
          git checkout "$data_branch" -- "$data_path"
          python collector/seoul_month_recovery.py --month "$TARGET_MONTH" --publish
          node --input-type=module -e "import fs from 'node:fs'; import {validate,pairs,metrics} from './dist/engine.mjs'; const d=validate(JSON.parse(fs.readFileSync('dist/history/'+process.env.TARGET_MONTH+'-api/seoul.json'))); const r=pairs(d,'seoul',Date.parse(d.period.end),d.period.days); if(r.length!==d.period.days*8)throw Error('Coverage'); console.log('METRICS '+process.env.TARGET_MONTH+' '+JSON.stringify(metrics(r)));"
          node --test tests/engine.test.mjs
          git add "$data_path" "dist/history/${TARGET_MONTH}-api" dist/history-index.json "dist/usage-seoul-${TARGET_MONTH}.json" PROGRESS.md
          git commit -m "Publish Seoul ${TARGET_MONTH} API scores and measured usage"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seoul-${{ matrix.month }}-checkpoints
          path: archive/hub/seoul/${{ matrix.month }}/
          retention-days: 30
